<style>
:root{--paper:#fcf1f2;--card:#f8dde3;--shadow:#dca0b3;--ink:#5a1428;--deep:#36130d;--rose:#b83a5c;--pixel:"Pixelify Sans","Courier New",monospace;--text:"Familjen Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem 1.25rem;background:var(--paper);color:var(--ink);font-family:var(--text);overflow-x:hidden}
.card{position:relative;z-index:2;width:min(34rem,100%);background:var(--card);box-shadow:0 0 0 3px var(--ink),10px 10px 0 var(--shadow);padding:clamp(1.5rem,5vw,2.6rem);text-align:center}
.art{display:flex;justify-content:center;align-items:flex-end;gap:1.2rem;margin-bottom:1.4rem}
.art svg{height:4.5rem;width:auto;image-rendering:pixelated}
.art .cat{animation:bob 2.4s steps(2) infinite}
.k{font-family:var(--pixel);font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);margin:0 0 .6rem}
h1{font-family:var(--pixel);font-weight:600;font-size:clamp(2.6rem,10vw,4rem);line-height:1;margin:0;color:var(--deep);text-shadow:4px 4px 0 var(--shadow)}
.sub{font-family:var(--pixel);font-size:1.3rem;margin:1.1rem 0 0;color:var(--ink)}
.cursor{display:inline-block;width:.5em;height:1em;margin-left:.25em;vertical-align:-.12em;background:var(--rose);animation:blink 1.06s steps(1) infinite}
p.line{margin:1.1rem auto 0;max-width:26rem;line-height:1.65;font-size:1.02rem}
.btns{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.5rem}
.btn{font-family:var(--pixel);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink);padding:.6rem 1rem;box-shadow:0 0 0 2px var(--ink);transition:background .2s ease,color .2s ease}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.bar{margin:1.8rem auto 0;width:min(17rem,100%);height:22px;padding:4px;background:var(--paper);box-shadow:0 0 0 3px var(--ink),4px 4px 0 var(--shadow);position:relative}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--rose) 0 8px,transparent 8px 10px);animation:fill 4.8s steps(14) infinite}
.bar b{position:absolute;top:-13px;left:4px;width:14px;height:12px;background:var(--rose);clip-path:polygon(0 25%,25% 0,50% 25%,75% 0,100% 25%,100% 55%,50% 100%,0 55%);animation:ride 4.8s steps(14) infinite}
@keyframes fill{0%{width:0}85%,100%{width:100%}}
@keyframes ride{0%{left:0}85%,100%{left:calc(100% - 18px)}}
.sp{position:fixed;z-index:1;pointer-events:none;width:12px;height:12px;background:var(--rose);opacity:.35;clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);animation:tw 4s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.5;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
